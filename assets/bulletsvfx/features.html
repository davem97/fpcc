<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sidebar Only</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
    <style>
        body,
        h1,
        h2,
        h3,
        h4,
        h5 {
            font-family: "Poppins", sans-serif;
        }

        /* === FLEXBOX EQUAL HEIGHT LAYOUT === */
        .w3-row-padding {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .w3-row-padding::before,
        .w3-row-padding::after {
            display: none;
        }

        /* Main slideshow container */
#box1 {
    display: flex;
    flex: 0 1 680px;
    width: 100%;
    max-width: 680px;
    min-width: 0;
    box-sizing: border-box;
    padding: 0 8px;
    float: none;
}

        .w3-light-grey {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            width: 100%;
        }

        .w3-col.m4 .w3-container {
            flex-grow: 1;
            padding-bottom: 24px;
            /* buffer space at the bottom */
        }

        body {
            font-size: 16px;
            font-family: "Poppins", sans-serif;
            position: relative;
            /* Required for ::before positioning */
            z-index: 0;
            /* Ensure content stays above the background */
            margin: 0;
            padding: 0;
        }

        /* Background image using a fixed pseudo-element */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../images/project_background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            /* Push behind all content */
        }

        /* Style for the image container to position arrows */
        .image-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1200 / 811;
    overflow: hidden;
}

        .arrow-left,
        .arrow-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            /* slightly larger than 24px */
            font-weight: 600;
            /* semi-bold look */
            color: black;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            z-index: 1;
            transition: color 0.2s ease;
            outline: none;
            /* remove focus outline on click */
        }

        .arrow-left {
            left: 10px;
        }

        .arrow-right {
            right: 10px;
        }

        .arrow-left:hover,
        .arrow-right:hover,
        .arrow-left:active,
        .arrow-right:active {
            color: lightgray;
        }

        /* Ensure images remain responsive */
        .feature-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

        /* Replay button for video slides */
        .replay-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;

            padding: 12px 24px;
            background-color: rgba(0, 0, 0, 0.75);
            color: white;

            border: 1px solid white;
            border-radius: 6px;

            font-family: "Poppins", sans-serif;
            font-size: 16px;
            cursor: pointer;
        }

        .replay-button:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }

        @media screen and (max-width: 992px) {
    .sidebar-links {
        margin-top: 16px;
    }

    nav.w3-sidebar#mySidebar {
        width: 200px !important;
        left: 0;
    }

    .w3-main {
        margin-left: 0 !important;
    }

    /* Allow slideshow to use available tablet/mobile width */
    #box1 {
        flex: 0 1 680px;
        width: 100%;
        max-width: 680px;
        margin-bottom: 48px !important;
    }
}

        @media screen and (max-width: 600px) {
    #box1 {
        flex: 0 1 100%;
        width: 100%;
        max-width: 100%;
        margin-bottom: 40px !important;
    }

    .arrow-left,
    .arrow-right {
        font-size: 20px;
        padding: 6px;
    }

    /* Smaller replay button for mobile */
    .replay-button {
        font-size: 13px;
        padding: 8px 12px;
        max-width: calc(100% - 80px);
        white-space: nowrap;
    }
}
    </style>
</head>

<body>
    <!-- Sidebar/menu -->
    <nav class="w3-sidebar w3-dark-grey w3-collapse w3-top w3-large w3-padding w3-padding-top-32"
        style="z-index:3;width:300px;font-weight:bold;" id="mySidebar">
        <a href="javascript:void(0)" onclick="w3_close()" class="w3-button w3-hide-large w3-display-topleft"
            style="width:100%;font-size:22px;border:2px solid white;">Close Menu</a>
        <div class="w3-padding-16 w3-hide-large"></div>

        <div class="w3-container w3-center w3-hide-small w3-hide-medium">
            <a href="/fpcc/">
                <img src="../images/Switchback Games logo.png" alt="Logo" style="width: 80%; max-width: 180px;"
                    class="w3-image">
            </a>
        </div>

        <div class="w3-container w3-hide-small w3-hide-medium">
            <hr style="border: 1px solid white; width: 80%; margin: 32px auto;">
        </div>
        <div class="w3-bar-block sidebar-links">
            <a href="/fpcc/assets/westernguns" class="w3-bar-item w3-button w3-hover-white">Home</a>
            <a href="/fpcc/assets/westernguns/features" class="w3-bar-item w3-button w3-hover-white">Features</a>
            <a href="/fpcc/assets/westernguns/changelog" class="w3-bar-item w3-button w3-hover-white">Changelog</a>
            <a href="/fpcc/assets/westernguns/faq" class="w3-bar-item w3-button w3-hover-white">FAQ</a>
            <a href="/fpcc/assets/westernguns/contact" class="w3-bar-item w3-button w3-hover-white">Contact</a>
        </div>
    </nav>

    <div class="w3-main" style="margin-left:300px">
        <div class="w3-container w3-center" style="padding-top:64px">
            <h1>Features</h1>
        </div>
    </div>

    <div class="w3-main" style="margin-left:300px">
        <div class="w3-row-padding" style="padding:32px 16px">
            <!-- Box 1 -->
            <div class="w3-col m4 w3-margin-bottom" id="box1">
                <div class="w3-light-grey">
                    <div class="image-container">

                        <!-- Normal slideshow images -->
                        <img src="../images/Bullet_Tracers.png" alt="featureOne" class="feature-image">

                        <!-- Video for Slide 4 -->
                        <video id="featureVideo" class="feature-image" muted playsinline preload="metadata"
                            style="display:none;">
                            <source src="../images/Gif_Tracers_Unity.mp4" type="video/mp4">
                        </video>

                        <!-- Replay button -->
                        <button id="replayButton" class="replay-button" onclick="replayVideo()" style="display:none;">
                            ↻ Replay
                        </button>

                        <!-- Existing slideshow arrows -->
                        <button class="arrow-left" onclick="changeContent('box1', -1)">←</button>

                        <button class="arrow-right" onclick="changeContent('box1', 1)">→</button>

                    </div>
                    <div class="w3-container">
                        <h3 class="feature-title">Bullet Tracers</h3>
                        <p class="feature-text">The primary feature of this asset, these bullet tracers are simple but
                            effective,
                            visually travel, with plenty of customization options to fit your project.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Top menu on small screens -->
    <header class="w3-container w3-top w3-hide-large w3-dark-grey w3-xlarge w3-padding">
        <a href="javascript:void(0)" class="w3-button w3-dark-grey w3-margin-right" onclick="w3_open()">☰</a>
        <a href="/fpcc/" style="color: white; text-decoration: none; font-weight: bold;">Switchback Games</a>
    </header>


    <!-- Overlay effect when opening sidebar on small screens -->
    <div class="w3-overlay w3-hide-large" onclick="w3_close()" style="cursor:pointer" title="close side menu"
        id="myOverlay"></div>

    <script>
        function w3_open() {
            document.getElementById("mySidebar").style.display = "block";
            document.getElementById("myOverlay").style.display = "block";
        }

        function w3_close() {
            document.getElementById("mySidebar").style.display = "none";
            document.getElementById("myOverlay").style.display = "none";
        }

        // Data for each box: images, titles, and texts
        const boxContent = {
            box1: {
                images: [
                    "../images/Bullet_Tracers.png",
                    "../images/Muzzle_Smoke.png",
                    "../images/Muzzle_Effects.png",
                    "../images/Gif_Tracers_Unity.mp4",
                    "../images/feature5.png",
                    "../images/feature6.png"
                ],
                titles: [
                    "Bullet Tracers",
                    "Smoke Trails",
                    "Muzzle Effects",
                    "Lingering Tracers",
                    "Feature 5",
                    "Feature 6"
                ],
                texts: [
                    "The primary feature of this asset, these bullet tracers are simple but effective, visually travel, with plenty of customization options to fit your project.",

                    "Straight-forward smoke trails that can be toggled on or off for each weapon, with adjustable textures and inspector settings to slightly change their appearance",

                    "Other effects including muzzle flash, muzzle sparks and muzzle smoke which are all included in this asset and are enabled by default, and also come with multiple visual variants.",

                    "Tracers linger in the distance for a short duration, but can also be toggled off. ",

                    "Description for feature 5.",

                    "Description for feature 6."
                ],
                currentIndex: 0
            }
        };

        // Play the video from the beginning
        function playSlideVideo() {
            const video = document.getElementById("featureVideo");
            const replayButton = document.getElementById("replayButton");

            replayButton.style.display = "none";

            video.pause();
            video.currentTime = 0;

            const playPromise = video.play();

            // If autoplay is blocked, show the replay button
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    if (video.style.display !== "none") {
                        replayButton.style.display = "block";
                    }
                });
            }
        }

        // Replay video manually
        function replayVideo() {
            playSlideVideo();
        }

        // Display replay button after video finishes
        document.getElementById("featureVideo").addEventListener("ended", function () {
            document.getElementById("replayButton").style.display = "block";
        });

        // Function to change slideshow content
        function changeContent(boxId, direction) {
            const box = boxContent[boxId];
            const totalItems = box.images.length;

            // Update current index
            box.currentIndex = (box.currentIndex + direction + totalItems) % totalItems;

            // Get DOM elements
            const image = document.querySelector(`#${boxId} img.feature-image`);
            const video = document.getElementById("featureVideo");
            const replayButton = document.getElementById("replayButton");
            const title = document.querySelector(`#${boxId} .feature-title`);
            const text = document.querySelector(`#${boxId} .feature-text`);

            // Stop any video currently playing
            video.pause();
            replayButton.style.display = "none";

            // Slide 3: Show MP4 video
            if (box.currentIndex === 3) {
                image.style.display = "none";
                video.style.display = "block";

                playSlideVideo();
            }
            else {
                // Slides 1, 2, 4, 5 and 6: Show images
                video.style.display = "none";
                image.style.display = "block";

                image.src = box.images[box.currentIndex];
                image.alt = box.titles[box.currentIndex];
            }

            // Update title and description
            title.textContent = box.titles[box.currentIndex];
            text.textContent = box.texts[box.currentIndex];
        }
    </script>
</body>

</html>
